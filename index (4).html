<script>
  // Polyfill do window.storage (API exclusiva dos artefatos do Claude.ai)
  // usando o localStorage do proprio navegador, para o app sempre ter
  // uma copia local instantanea mesmo antes/sem conectar ao OneDrive.
  (function () {
    function ok(obj) { return Promise.resolve(obj); }
    window.storage = {
      get: function (key) {
        try {
          const value = window.localStorage.getItem(key);
          if (value === null) return ok(null);
          return ok({ key: key, value: value, shared: false });
        } catch (e) { return Promise.reject(e); }
      },
      set: function (key, value) {
        try {
          window.localStorage.setItem(key, value);
          return ok({ key: key, value: value, shared: false });
        } catch (e) { return Promise.reject(e); }
      },
      delete: function (key) {
        try {
          window.localStorage.removeItem(key);
          return ok({ key: key, deleted: true, shared: false });
        } catch (e) { return Promise.reject(e); }
      },
      list: function (prefix) {
        try {
          const keys = Object.keys(window.localStorage).filter(function (k) {
            return !prefix || k.indexOf(prefix) === 0;
          });
          return ok({ keys: keys, prefix: prefix || null, shared: false });
        } catch (e) { return Promise.reject(e); }
      }
    };
  })();

  // Modulo de sincronizacao com o OneDrive via Microsoft Graph (MSAL.js)
  window.oneDriveSync = (function () {
    const CLIENT_ID = "d4ae8f0b-073b-49fc-b103-a5c8f22255f1";
    const FILE_NAME = "CONTROLE_ESTOQUE_GERAL_Brasquality.xlsx";
    const SCOPES = ["Files.ReadWrite", "offline_access", "User.Read"];

    let msalInstance = null;
    let account = null;
    let fileId = null;

    async function init() {
      if (!msalInstance) {
        msalInstance = new msal.PublicClientApplication({
          auth: {
            clientId: CLIENT_ID,
            authority: "https://login.microsoftonline.com/consumers",
            redirectUri: window.location.origin + window.location.pathname,
          },
          cache: { cacheLocation: "localStorage" },
        });
      }
      try {
        const response = await msalInstance.handleRedirectPromise();
        if (response && response.account) account = response.account;
      } catch (e) {
        console.error("Erro ao processar retorno do login Microsoft", e);
      }
      if (!account) {
        const cached = msalInstance.getAllAccounts();
        if (cached.length > 0) account = cached[0];
      }
      fileId = window.localStorage.getItem("bq_onedrive_file_id") || null;
      return account;
    }

    async function login() {
      // redireciona a pagina inteira para o login da Microsoft (mais confiavel que pop-up,
      // principalmente em navegadores que bloqueiam pop-ups ou no celular).
      await msalInstance.loginRedirect({ scopes: SCOPES });
    }

    function logout() {
      account = null;
      fileId = null;
      window.localStorage.removeItem("bq_onedrive_file_id");
    }

    async function getToken() {
      if (!account) throw new Error("Nao autenticado no OneDrive.");
      try {
        const result = await msalInstance.acquireTokenSilent({ scopes: SCOPES, account: account });
        return result.accessToken;
      } catch (e) {
        await msalInstance.acquireTokenRedirect({ scopes: SCOPES, account: account });
        throw new Error("Redirecionando para renovar o login...");
      }
    }

    async function findFileId() {
      if (fileId) return fileId;
      const token = await getToken();
      // procura em todo o OneDrive (nao so na raiz), pois o arquivo pode estar em qualquer pasta
      const res = await fetch("https://graph.microsoft.com/v1.0/me/drive/root/search(q='" + encodeURIComponent(FILE_NAME) + "')", {
        headers: { Authorization: "Bearer " + token },
      });
      if (!res.ok) throw new Error("Erro ao procurar arquivo no OneDrive (codigo " + res.status + ")");
      const data = await res.json();
      const match = (data.value || []).find(function (item) {
        return item.name && item.name.toLowerCase() === FILE_NAME.toLowerCase();
      }) || (data.value || [])[0];
      if (!match) {
        throw new Error("Nao encontrei nenhum arquivo chamado \"" + FILE_NAME + "\" no seu OneDrive. Confira o nome exato do arquivo.");
      }
      fileId = match.id;
      window.localStorage.setItem("bq_onedrive_file_id", fileId);
      return fileId;
    }

    async function downloadFile() {
      const token = await getToken();
      const id = await findFileId();
      const res = await fetch("https://graph.microsoft.com/v1.0/me/drive/items/" + id + "/content", {
        headers: { Authorization: "Bearer " + token },
      });
      if (!res.ok) throw new Error("Erro ao baixar arquivo do OneDrive (codigo " + res.status + ")");
      return await res.arrayBuffer();
    }

    async function uploadFile(arrayBuffer) {
      const token = await getToken();
      const id = await findFileId();
      const res = await fetch("https://graph.microsoft.com/v1.0/me/drive/items/" + id + "/content", {
        method: "PUT",
        headers: {
          Authorization: "Bearer " + token,
          "Content-Type": "application/octet-stream",
        },
        body: arrayBuffer,
      });
      if (!res.ok) throw new Error("Erro ao salvar arquivo no OneDrive (codigo " + res.status + ")");
      return await res.json();
    }

    return {
      init: init, login: login, logout: logout, getToken: getToken,
      findFileId: findFileId, downloadFile: downloadFile, uploadFile: uploadFile,
      getAccount: function () { return account; },
      FILE_NAME: FILE_NAME,
    };
  })();

  window.addEventListener('error', function (e) {
    var el = document.getElementById('app-fatal');
    el.style.display = 'block';
    el.textContent = 'Erro ao carregar o app:\n' + (e.error && e.error.stack ? e.error.stack : e.message);
  });
</script>

/* ============================= LIGHTWEIGHT SVG CHARTS (no external chart lib) ============================= */
function GroupedBarChart({ data, xKey, series, height = 220 }) {
  const width = 640;
  const padL = 40, padR = 10, padT = 10, padB = 28;
  const innerW = width - padL - padR;
  const innerH = height - padT - padB;
  const maxVal = Math.max(1, ...data.flatMap((d) => series.map((s) => Number(d[s.key]) || 0)));
  const groupW = innerW / data.length;
  const barW = Math.min(22, (groupW - 16) / series.length);
  const niceTicks = 4;
  return (
    <svg viewBox={"0 0 " + width + " " + height} className="w-full" style={{ maxHeight: height }}>
      {Array.from({ length: niceTicks + 1 }).map((_, i) => {
        const y = padT + innerH - (i / niceTicks) * innerH;
        const val = Math.round((maxVal * i) / niceTicks);
        return (
          <g key={i}>
            <line x1={padL} x2={width - padR} y1={y} y2={y} stroke="#E4E9F5" strokeWidth="1" />
            <text x={padL - 8} y={y + 3} textAnchor="end" fontSize="10" fill="#64748B">{val}</text>
          </g>
        );
      })}
      {data.map((d, gi) => {
        const gx = padL + gi * groupW + groupW / 2 - (series.length * barW) / 2;
        return (
          <g key={gi}>
            {series.map((s, si) => {
              const val = Number(d[s.key]) || 0;
              const h = (val / maxVal) * innerH;
              return (
                <rect key={s.key} x={gx + si * barW} y={padT + innerH - h} width={barW - 3} height={h}
                  fill={s.color} rx="3" />
              );
            })}
            <text x={padL + gi * groupW + groupW / 2} y={height - 8} textAnchor="middle" fontSize="10" fill="#64748B">
              {d[xKey]}
            </text>
          </g>
        );
      })}
      <g transform={"translate(" + padL + ", 2)"}>
        {series.map((s, i) => (
          <g key={s.key} transform={"translate(" + i * 90 + ", 0)"}>
            <rect width="9" height="9" rx="2" fill={s.color} />
            <text x="13" y="8" fontSize="10" fill="#475569">{s.name}</text>
          </g>
        ))}
      </g>
    </svg>
  );
}

function HorizontalBarChart({ data, labelKey, valueKey, color = "#C8492D", height = 220 }) {
  const width = 640;
  const padL = 120, padR = 30, padT = 6, padB = 6;
  const rowH = Math.max(18, (height - padT - padB) / data.length);
  const innerW = width - padL - padR;
  const maxVal = Math.max(1, ...data.map((d) => Number(d[valueKey]) || 0));
  return (
    <svg viewBox={"0 0 " + width + " " + Math.max(height, rowH * data.length)} className="w-full">
      {data.map((d, i) => {
        const val = Number(d[valueKey]) || 0;
        const w = (val / maxVal) * innerW;
        const y = i * rowH;
        return (
          <g key={i}>
            <text x={padL - 8} y={y + rowH / 2 + 3.5} textAnchor="end" fontSize="10" fill="#16233F">
              {String(d[labelKey]).length > 18 ? String(d[labelKey]).slice(0, 17) + "\u2026" : d[labelKey]}
            </text>
            <rect x={padL} y={y + rowH * 0.2} width={Math.max(2, w)} height={rowH * 0.6} fill={color} rx="3" />
            <text x={padL + w + 6} y={y + rowH / 2 + 3.5} fontSize="10" fill="#475569">{val}</text>
          </g>
        );
      })}
    </svg>
  );
}


/* ============================= HELPERS ============================= */
function uid(prefix) {
  return prefix + "_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function fmtDate(iso) {
  if (!iso) return "-";
  const d = new Date(iso + (iso.length <= 10 ? "T00:00:00" : ""));
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("pt-BR");
}

function fmtMoney(v) {
  const n = Number(v) || 0;
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function fmtNum(v) {
  const n = Number(v) || 0;
  return n.toLocaleString("pt-BR", { maximumFractionDigits: 2 });
}

function getStatus(p) {
  const atual = Number(p.estoqueAtual) || 0;
  const minimo = Number(p.estoqueMinimo) || 0;
  if (atual <= 0) return "zerado";
  if (atual <= minimo * 0.5) return "critico";
  if (atual <= minimo) return "baixo";
  return "normal";
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportWorkbook(sheets, filename) {
  const wb = XLSX.utils.book_new();
  sheets.forEach(({ name, rows }) => {
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  });
  const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  downloadBlob(new Blob([out], { type: "application/octet-stream" }), filename);
}

const HEADER_ALIASES = {
  codigo: ["codigo", "código", "cod"],
  descricao: ["descricao", "descrição", "discricao do produto", "discrição do produto", "descrição do produto", "item", "produto"],
  categoria: ["categoria", "grupo"],
  unidade: ["unidade", "und", "un", "unid"],
  fornecedor: ["fornecedor", "fornecedor principal"],
  estoqueAtual: ["estoqueatual", "estoque atual", "estoque geral", "quantidade", "qtd"],
  estoqueMinimo: ["estoqueminimo", "estoque minimo", "estoque mínimo", "minimo"],
  estoqueMaximo: ["estoquemaximo", "estoque maximo", "estoque máximo", "maximo"],
  custoUnitario: ["custounitario", "custo", "custo unitario", "valor unitario", "preco"],
  localizacao: ["localizacao", "localização", "local"],
  observacao: ["observacao", "observação", "obs"],
};

function normHeader(h) {
  return String(h || "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function mapImportedRow(row) {
  const normRow = {};
  Object.keys(row).forEach((k) => { normRow[normHeader(k)] = row[k]; });
  const out = {};
  Object.entries(HEADER_ALIASES).forEach(([field, aliases]) => {
    for (const alias of aliases) {
      const na = normHeader(alias);
      if (normRow[na] !== undefined && normRow[na] !== "") {
        out[field] = normRow[na];
        break;
      }
    }
  });
  return out;
}

function buildFullWorkbookArrayBuffer(prods, forns, movs) {
  const rows = prods.map((p) => ({
    Codigo: p.codigo, Descricao: p.descricao, Categoria: p.categoria, Subcategoria: p.subcategoria,
    Unidade: p.unidade, Localizacao: p.localizacao, "Estoque Atual": p.estoqueAtual,
    "Estoque Minimo": p.estoqueMinimo, "Estoque Maximo": p.estoqueMaximo,
    "Custo Unitario": p.custoUnitario, Observacao: p.observacao,
  }));
  const fornRows = forns.map((f) => ({
    Codigo: f.codigo, "Razao Social": f.razaoSocial, "Nome Fantasia": f.nomeFantasia,
    CNPJ: f.cnpj, Telefone: f.telefone, Email: f.email, Contato: f.contato, "Prazo Entrega": f.prazoEntrega,
  }));
  const movRows = movs.map((m) => ({
    Data: fmtDate(m.data), Tipo: m.tipo, ProdutoId: m.produtoId, Quantidade: m.quantidade,
    "Estoque Antes": m.estoqueAntes, "Estoque Depois": m.estoqueDepois, Responsavel: m.responsavel || "",
  }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Estoque");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(fornRows), "Fornecedores");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(movRows), "Movimentacoes");
  // aba tecnica escondida com o estado completo (preserva IDs entre sincronizacoes)
  const appData = { products: prods, fornecedores: forns, movimentacoes: movs, savedAt: new Date().toISOString() };
  const wsData = XLSX.utils.aoa_to_sheet([[JSON.stringify(appData)]]);
  XLSX.utils.book_append_sheet(wb, wsData, "AppData");
  return XLSX.write(wb, { bookType: "xlsx", type: "array" });
}

function parseWorkbookToState(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: "array" });
  if (wb.SheetNames.includes("AppData")) {
    const ws = wb.Sheets["AppData"];
    const cell = ws["A1"];
    if (cell && cell.v) {
      try {
        const parsed = JSON.parse(cell.v);
        return {
          products: Array.isArray(parsed.products) ? parsed.products : [],
          fornecedores: Array.isArray(parsed.fornecedores) ? parsed.fornecedores : [],
          movimentacoes: Array.isArray(parsed.movimentacoes) ? parsed.movimentacoes : [],
        };
      } catch (e) { /* segue para o fallback abaixo */ }
    }
  }
  // primeira sincronizacao: planilha ainda nao tem a aba tecnica, le a aba "Estoque" pelo nome das colunas
  const sheetName = wb.SheetNames.find((n) => normHeader(n) === "estoque") || wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const json = XLSX.utils.sheet_to_json(ws, { defval: "" });
  const mapped = json.map(mapImportedRow).filter((r) => r.descricao);
  const products = mapped.map((r) => ({
    id: uid("p"), codigo: r.codigo || "", codigoInterno: "", descricao: r.descricao,
    categoria: r.categoria || "", subcategoria: "", unidade: r.unidade || "UN",
    localizacao: r.localizacao || "", estoqueAtual: Number(r.estoqueAtual) || 0,
    estoqueMinimo: Number(r.estoqueMinimo) || 10, estoqueMaximo: Number(r.estoqueMaximo) || 100,
    qtdIdealCompra: Number(r.estoqueMaximo) || 100, custoUnitario: Number(r.custoUnitario) || 0,
    fornecedorId: "", observacao: r.observacao || "", dataCadastro: todayISO(),
  }));
  return { products, fornecedores: [], movimentacoes: [] };
}

/* ============================= ERROR BOUNDARY (rede de seguranca) ============================= */
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, info) {
    console.error("Erro nao tratado capturado pelo ErrorBoundary:", error, info);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "system-ui, sans-serif", padding: 24, background: "#F4F6FB" }}>
          <div style={{ maxWidth: 440, textAlign: "center" }}>
            <p style={{ fontSize: 16, fontWeight: 700, color: "#16233F", marginBottom: 8 }}>Algo deu errado nesta tela</p>
            <p style={{ fontSize: 13, color: "#64748B", lineHeight: 1.6, marginBottom: 16 }}>
              Um erro inesperado interrompeu o aplicativo. Seus dados ja salvos nao foram apagados.
              Recarregue a pagina para continuar. Se o erro se repetir, exporte seus dados (aba Excel)
              assim que possivel e avise o suporte.
            </p>
            <button
              onClick={() => window.location.reload()}
              style={{ background: "#2452B0", color: "#fff", border: "none", padding: "10px 20px", borderRadius: 10, fontWeight: 600, fontSize: 13, cursor: "pointer" }}
            >
              Recarregar pagina
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ============================= APP ============================= */
function App() {
  const [loaded, setLoaded] = useState(false);
  const [products, setProducts] = useState([]);
  const [fornecedores, setFornecedores] = useState([]);
  const [movimentacoes, setMovimentacoes] = useState([]);
  const [tab, setTab] = useState("dashboard");
  const [toast, setToast] = useState(null);
  const saveTimer = useRef(null);

  const [storageOk, setStorageOk] = useState(true);

  const [odStatus, setOdStatus] = useState("idle"); // idle | connecting | connected | error
  const [odError, setOdError] = useState("");
  const [odAccountName, setOdAccountName] = useState("");
  const [odLastSync, setOdLastSync] = useState(null);
  const odAutoTried = useRef(false);

  const showToast = useCallback((msg, kind) => {
    setToast({ msg, kind: kind || "ok" });
    setTimeout(() => setToast(null), 2600);
  }, []);

  const connectOneDrive = useCallback(async () => {
    setOdStatus("connecting");
    setOdError("");
    try {
      const account = await window.oneDriveSync.init();
      if (!account) {
        await window.oneDriveSync.login(); // redireciona a pagina; nada abaixo executa
        return;
      }
      setOdAccountName((account && (account.username || account.name)) || "");
      const buf = await window.oneDriveSync.downloadFile();
      const state = parseWorkbookToState(buf);
      setProducts((prev) => (state.products.length ? state.products : prev));
      setFornecedores((prev) => (state.fornecedores.length ? state.fornecedores : prev));
      setMovimentacoes(state.movimentacoes);
      setOdStatus("connected");
      setOdLastSync(new Date());
      showToast("Conectado ao OneDrive. Dados carregados de " + window.oneDriveSync.FILE_NAME + ".");
    } catch (e) {
      console.error("Falha ao conectar ao OneDrive", e);
      setOdStatus("error");
      setOdError((e && e.message) || String(e));
      showToast("Falha ao conectar com o OneDrive: " + ((e && e.message) || e), "warn");
    }
  }, [showToast]);

  const disconnectOneDrive = useCallback(() => {
    window.oneDriveSync.logout();
    setOdStatus("idle");
    setOdAccountName("");
    setOdError("");
    showToast("Desconectado do OneDrive. Os dados continuam salvos neste navegador.");
  }, [showToast]);

  // tenta reconectar automaticamente: cobre tanto uma sessao ja ativa quanto o retorno do
  // redirecionamento de login (a pagina recarrega sozinha depois do login na Microsoft)
  useEffect(() => {
    if (!loaded || odAutoTried.current) return;
    odAutoTried.current = true;
    (async () => {
      try {
        const acc = await window.oneDriveSync.init();
        if (acc) connectOneDrive();
      } catch (e) {
        console.error("Falha ao inicializar OneDrive", e);
      }
    })();
  }, [loaded, connectOneDrive]);

  // load
  useEffect(() => {
    (async () => {
      // 1) testa se este navegador realmente consegue gravar e ler dados locais
      try {
        const probeKey = "__bq_storage_probe__";
        const probeVal = String(Date.now());
        await window.storage.set(probeKey, probeVal);
        const probeRes = await window.storage.get(probeKey);
        if (!probeRes || probeRes.value !== probeVal) throw new Error("probe mismatch");
        await window.storage.delete(probeKey);
        setStorageOk(true);
      } catch (e) {
        console.error("Armazenamento local indisponivel neste navegador", e);
        setStorageOk(false);
      }

      // 2) carrega os dados salvos (se houver)
      try {
        const res = await window.storage.get(STORAGE_KEY);
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          const prods = Array.isArray(parsed.products) && parsed.products.length ? parsed.products : SEED_PRODUCTS;
          const forns = Array.isArray(parsed.fornecedores) && parsed.fornecedores.length ? parsed.fornecedores : SEED_FORNECEDORES;
          setProducts(prods);
          setFornecedores(forns);
          setMovimentacoes(Array.isArray(parsed.movimentacoes) ? parsed.movimentacoes : []);
        } else {
          setProducts(SEED_PRODUCTS);
          setFornecedores(SEED_FORNECEDORES);
          setMovimentacoes([]);
        }
      } catch (e) {
        console.error("Falha ao carregar dados salvos", e);
        setProducts(SEED_PRODUCTS);
        setFornecedores(SEED_FORNECEDORES);
        setMovimentacoes([]);
        showToast("Nao foi possivel carregar dados salvos anteriormente. Comecando do zero.", "warn");
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  // save (debounced)
  useEffect(() => {
    if (!loaded) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        const result = await window.storage.set(STORAGE_KEY, JSON.stringify({ products, fornecedores, movimentacoes }));
        if (!result) throw new Error("storage.set retornou vazio");
        setStorageOk(true);
      } catch (e) {
        console.error("Falha ao salvar", e);
        setStorageOk(false);
        showToast("Atencao: as alteracoes nao puderam ser salvas neste navegador (armazenamento local bloqueado ou cheio). Exporte para Excel para nao perder os dados.", "warn");
      }

      if (odStatus === "connected") {
        try {
          const buf = buildFullWorkbookArrayBuffer(products, fornecedores, movimentacoes);
          await window.oneDriveSync.uploadFile(buf);
          setOdLastSync(new Date());
          setOdError("");
        } catch (e) {
          console.error("Falha ao sincronizar com OneDrive", e);
          setOdStatus("error");
          setOdError((e && e.message) || String(e));
          showToast("Falha ao sincronizar com o OneDrive: " + ((e && e.message) || e), "warn");
        }
      }
    }, 800);
    return () => clearTimeout(saveTimer.current);
  }, [products, fornecedores, movimentacoes, loaded, odStatus]);

  const fornecedorNome = useCallback((id) => {
    const f = fornecedores.find((x) => x.id === id);
    return f ? (f.nomeFantasia || f.razaoSocial) : "-";
  }, [fornecedores]);

  const categorias = useMemo(() => {
    const s = new Set(products.map((p) => p.categoria).filter(Boolean));
    return Array.from(s).sort();
  }, [products]);

  const categoriasComContagem = useMemo(() => {
    const counts = {};
    products.forEach((p) => {
      if (!p.categoria) return;
      counts[p.categoria] = (counts[p.categoria] || 0) + 1;
    });
    return Object.entries(counts).map(([nome, count]) => ({ nome, count })).sort((a, b) => b.count - a.count);
  }, [products]);

  function mesclarCategorias(de, para) {
    if (!de || !para || de === para) return;
    const n = products.filter((p) => p.categoria === de).length;
    setProducts((prev) => prev.map((p) => (p.categoria === de ? { ...p, categoria: para } : p)));
    showToast(n + " itens movidos de \"" + de + "\" para \"" + para + "\".");
  }

  function registrarMovimentacao(mov) {
    setMovimentacoes((prev) => [{ id: uid("m"), data: new Date().toISOString(), ...mov }, ...prev]);
  }

  function addProduct(p) {
    const novo = { id: uid("p"), dataCadastro: todayISO(), ...p };
    setProducts((prev) => [novo, ...prev]);
    showToast("Item cadastrado com sucesso.");
  }

  function updateProduct(id, patch) {
    setProducts((prev) => prev.map((p) => (p.id === id ? { ...p, ...patch } : p)));
    showToast("Alteracoes salvas.");
  }

  function deleteProduct(id) {
    setProducts((prev) => prev.filter((p) => p.id !== id));
    showToast("Item excluido.", "warn");
  }

  function doEntrada(payload) {
    const prod = products.find((p) => p.id === payload.produtoId);
    if (!prod) return;
    const antes = Number(prod.estoqueAtual) || 0;
    const depois = antes + Number(payload.quantidade);
    updateProduct(prod.id, { estoqueAtual: depois });
    registrarMovimentacao({
      tipo: "entrada", produtoId: prod.id, quantidade: Number(payload.quantidade),
      estoqueAntes: antes, estoqueDepois: depois, responsavel: payload.responsavel,
      fornecedor: payload.fornecedor, notaFiscal: payload.notaFiscal, pedido: payload.pedido,
      valorUnitario: payload.valorUnitario, observacao: payload.observacao, dataMov: payload.data,
    });
    showToast("Entrada registrada: " + prod.descricao);
  }

  function doSaida(payload) {
    const prod = products.find((p) => p.id === payload.produtoId);
    if (!prod) return { ok: false };
    const antes = Number(prod.estoqueAtual) || 0;
    const qtd = Number(payload.quantidade);
    if (qtd > antes) {
      return { ok: false, disponivel: antes, solicitado: qtd };
    }
    const depois = antes - qtd;
    updateProduct(prod.id, { estoqueAtual: depois });
    registrarMovimentacao({
      tipo: "saida", produtoId: prod.id, quantidade: qtd,
      estoqueAntes: antes, estoqueDepois: depois, responsavel: payload.responsavel,
      setor: payload.setor, motivo: payload.motivo, ordemProducao: payload.ordemProducao,
      observacao: payload.observacao, dataMov: payload.data,
    });
    showToast("Saida registrada: " + prod.descricao);
    return { ok: true };
  }

  function doAjuste(payload) {
    const prod = products.find((p) => p.id === payload.produtoId);
    if (!prod) return;
    const antes = Number(prod.estoqueAtual) || 0;
    const depois = Number(payload.novoEstoque);
    updateProduct(prod.id, { estoqueAtual: depois });
    registrarMovimentacao({
      tipo: "ajuste", produtoId: prod.id, quantidade: depois - antes,
      estoqueAntes: antes, estoqueDepois: depois, responsavel: payload.responsavel,
      motivo: payload.motivo, observacao: payload.observacao, dataMov: payload.data,
    });
    showToast("Ajuste registrado: " + prod.descricao);
  }

  function resetDemo() {
    setProducts(SEED_PRODUCTS);
    setFornecedores(SEED_FORNECEDORES);
    setMovimentacoes([]);
    showToast("Dados restaurados para a planilha original importada.");

  function clearAll() {

  const NAV = [

/* ============================= DASHBOARD ============================= */
function Dashboard({ products, movimentacoes, fornecedorNome, setTab }) {
  const stats = useMemo(() => {
    let normal = 0, baixo = 0, critico = 0, zerado = 0, valorTotal = 0, valorCompras = 0, itensComprar = 0;
    products.forEach((p) => {
      const st = getStatus(p);
      if (st === "normal") normal++;
      else if (st === "baixo") baixo++;
      else if (st === "critico") critico++;
      else if (st === "zerado") zerado++;
      valorTotal += (Number(p.estoqueAtual) || 0) * (Number(p.custoUnitario) || 0);
      if (st !== "normal") {
        itensComprar++;
        const sugerido = Math.max(0, (Number(p.estoqueMaximo) || 0) - (Number(p.estoqueAtual) || 0));
        valorCompras += sugerido * (Number(p.custoUnitario) || 0);
      }
    });
    return { total: products.length, normal, baixo, critico, zerado, valorTotal, valorCompras, itensComprar };
  }, [products]);

  const last30 = useMemo(() => {
    const cutoff = Date.now() - 30 * 24 * 3600 * 1000;
    let entradas = 0, saidas = 0;
    movimentacoes.forEach((m) => {
      const t = new Date(m.data).getTime();
      if (t >= cutoff) {
        if (m.tipo === "entrada") entradas += Number(m.quantidade) || 0;
        if (m.tipo === "saida") saidas += Number(m.quantidade) || 0;
      }
    });
    return { entradas, saidas };
  }, [movimentacoes]);

  const monthly = useMemo(() => {
    const map = {};
    movimentacoes.forEach((m) => {
      const d = new Date(m.data);
      const key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
      if (!map[key]) map[key] = { mes: key, entradas: 0, saidas: 0 };
      if (m.tipo === "entrada") map[key].entradas += Number(m.quantidade) || 0;
      if (m.tipo === "saida") map[key].saidas += Number(m.quantidade) || 0;
    });
    return Object.values(map).sort((a, b) => a.mes.localeCompare(b.mes)).slice(-6);
  }, [movimentacoes]);

  const topConsumidos = useMemo(() => {
    const map = {};
    movimentacoes.forEach((m) => {
      if (m.tipo !== "saida") return;
      map[m.produtoId] = (map[m.produtoId] || 0) + (Number(m.quantidade) || 0);
    });
    return Object.entries(map)
      .map(([id, qtd]) => ({ id, qtd, nome: products.find((p) => p.id === id)?.descricao || "?" }))
      .sort((a, b) => b.qtd - a.qtd)
      .slice(0, 6);
  }, [movimentacoes, products]);

  const categoriaCritica = useMemo(() => {
    const map = {};
    products.forEach((p) => {
      const st = getStatus(p);
      if (st === "critico" || st === "zerado") {
        map[p.categoria] = (map[p.categoria] || 0) + 1;
      }
    });
    return Object.entries(map).map(([categoria, qtd]) => ({ categoria, qtd })).sort((a, b) => b.qtd - a.qtd).slice(0, 8);
  }, [products]);

  const cards = [
    { label: "Total de itens", value: fmtNum(stats.total), icon: Package, accent: "#2452B0" },
    { label: "Estoque normal", value: fmtNum(stats.normal), icon: CheckCircle2, accent: "#1E8E5A" },
    { label: "Estoque baixo", value: fmtNum(stats.baixo), icon: TrendingDown, accent: "#DC9A1F" },
    { label: "Estoque critico / zerado", value: fmtNum(stats.critico + stats.zerado), icon: AlertTriangle, accent: "#C8492D" },
  ];

  return (
    <div className="bq-fade-in">
      <div className="bq-hero px-6 py-6 mb-6 flex items-center justify-between flex-wrap gap-4">
        <div className="relative" style={{ zIndex: 1 }}>
          <h1 className="bq-display text-2xl font-bold text-white">Visao geral do estoque</h1>
          <p className="text-sm text-white/55 mt-1">Fabrica de colchoes Brasquality &middot; atualizado em tempo real</p>
        </div>
        <div className="relative flex items-center gap-4 flex-wrap" style={{ zIndex: 1 }}>
          <div className="text-right pr-4" style={{ borderRight: "1px solid rgba(255,255,255,0.12)" }}>
            <p className="text-xs text-white/50 font-medium">Valor em estoque</p>
            <p className="bq-display text-xl font-bold text-white bq-mono">{fmtMoney(stats.valorTotal)}</p>
          </div>
          <button onClick={() => setTab("compras")} className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white text-sm font-semibold bq-btn-primary">
            <ShoppingCart size={15} /> Ver sugestao de compras
          </button>
        </div>
      </div>

      {(stats.critico > 0 || stats.zerado > 0) && (
        <div className="mb-6 rounded-xl px-4 py-3 flex items-start gap-3" style={{ background: "#FCE7E3", border: "1px solid #F0C4BB" }}>
          <AlertTriangle size={18} className="text-[#B23A2E] mt-0.5 shrink-0" />
          <div className="text-sm text-[#7A1F1F]">
            <span className="font-semibold">Atencao:</span> {stats.zerado} {stats.zerado === 1 ? "item esta" : "itens estao"} sem estoque e {stats.critico} {stats.critico === 1 ? "item esta" : "itens estao"} em nivel critico. {stats.itensComprar} itens no total precisam de reposicao.
          </div>
        </div>
      )}

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-6">
        {cards.map((c) => (
          <div key={c.label} className="bg-white rounded-2xl p-5 border border-[#E4E9F5] bq-card-hover">
            <div className="flex items-center justify-between mb-3">
              <div className="w-9 h-9 rounded-lg flex items-center justify-center bq-icon-badge" style={{ background: c.accent + "18" }}>
                <c.icon size={16} style={{ color: c.accent }} />
              </div>
            </div>
            <p className="bq-display text-2xl font-bold text-[#16233F] bq-mono">{c.value}</p>
            <p className="text-xs text-[#64748B] mt-1">{c.label}</p>
          </div>
        ))}
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
        <div className="bg-white rounded-2xl p-5 border border-[#E4E9F5] bq-card-hover">
          <p className="text-xs text-[#64748B] font-medium mb-1">Compras sugeridas (estimado)</p>
          <p className="bq-display text-xl font-bold text-[#C8492D]">{fmtMoney(stats.valorCompras)}</p>
          <p className="text-xs text-[#64748B] mt-1">{stats.itensComprar} itens precisam de reposicao</p>
        </div>
        <div className="bg-white rounded-2xl p-5 border border-[#E4E9F5] bq-card-hover">
          <p className="text-xs text-[#64748B] font-medium mb-1">Movimentacao (30 dias)</p>
          <p className="text-sm text-[#16233F] flex items-center gap-3 mt-1.5">
            <span className="flex items-center gap-1 font-semibold text-[#1E8E5A]"><ArrowDownToLine size={13}/>{fmtNum(last30.entradas)}</span>
            <span className="flex items-center gap-1 font-semibold text-[#C8492D]"><ArrowUpFromLine size={13}/>{fmtNum(last30.saidas)}</span>
          </p>
        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-6">
        <div className="bg-white rounded-2xl p-5 border border-[#E4E9F5]">
          <p className="bq-display font-semibold text-[#16233F] mb-4">Entradas x Saidas por mes</p>
          {monthly.length === 0 ? (
            <p className="text-sm text-[#64748B] py-10 text-center">Sem movimentacoes registradas ainda.</p>
          ) : (
            <GroupedBarChart
              data={monthly}
              xKey="mes"
              height={220}
              series={[
                { key: "entradas", name: "Entradas", color: "#2452B0" },
                { key: "saidas", name: "Saidas", color: "#C8492D" },
              ]}
            />
          )}
        </div>
        <div className="bg-white rounded-2xl p-5 border border-[#E4E9F5]">
          <p className="bq-display font-semibold text-[#16233F] mb-4">Itens criticos por categoria</p>
          {categoriaCritica.length === 0 ? (
            <p className="text-sm text-[#64748B] py-10 text-center">Nenhuma categoria em estado critico.</p>
          ) : (
            <HorizontalBarChart
              data={categoriaCritica}
              labelKey="categoria"
              valueKey="qtd"
              color="#C8492D"
              height={220}
            />
          )}
        </div>
      </div>

      <div className="bg-white rounded-2xl p-5 border border-[#E4E9F5]">
        <p className="bq-display font-semibold text-[#16233F] mb-4">Produtos mais consumidos</p>
        {topConsumidos.length === 0 ? (
          <EmptyState icon={TrendingUp} title="Ainda sem saidas registradas" subtitle="Assim que voce registrar saidas de material, o ranking de consumo aparece aqui." />
        ) : (
          <div className="space-y-2.5">
            {topConsumidos.map((t, i) => (
              <div key={t.id} className="flex items-center gap-3">
                <span className="bq-mono text-xs text-[#64748B] w-5">{String(i + 1).padStart(2, "0")}</span>
                <span className="text-sm text-[#16233F] flex-1 truncate">{t.nome}</span>
                <span className="bq-mono text-sm font-semibold text-[#16233F]">{fmtNum(t.qtd)}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================= ESTOQUE (CADASTRO + TABELA) ============================= */
const emptyProduct = {
  codigo: "", codigoInterno: "", descricao: "", categoria: "", subcategoria: "",
  unidade: "UN", localizacao: "", estoqueAtual: 0, estoqueMinimo: 0, estoqueMaximo: 0,
  qtdIdealCompra: 0, custoUnitario: 0, fornecedorId: "", observacao: "",
};

function ProductForm({ initial, categorias, fornecedores, onSave, onCancel }) {
  const [form, setForm] = useState(initial || emptyProduct);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  const setNum = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value === "" ? "" : Number(e.target.value) }));

  function submit(e) {
    e.preventDefault();
    if (!form.descricao || !String(form.descricao).trim()) return;
    onSave({
      ...form,
      estoqueAtual: Number(form.estoqueAtual) || 0,
      estoqueMinimo: Number(form.estoqueMinimo) || 0,
      estoqueMaximo: Number(form.estoqueMaximo) || 0,
      qtdIdealCompra: Number(form.qtdIdealCompra) || 0,
      custoUnitario: Number(form.custoUnitario) || 0,
    });
  }

  return (
    <form onSubmit={submit}>
      <div className="grid grid-cols-2 gap-x-4">
        <Field label="Codigo"><input className={inputCls} value={form.codigo} onChange={set("codigo")} placeholder="Ex: TEC-014" /></Field>
        <Field label="Codigo interno"><input className={inputCls} value={form.codigoInterno} onChange={set("codigoInterno")} /></Field>
      </div>
      <Field label="Descricao" required>
        <input className={inputCls} value={form.descricao} onChange={set("descricao")} placeholder="Ex: Tecido Poliester Bambu 01" />
      </Field>
      <div className="grid grid-cols-2 gap-x-4">
        <Field label="Categoria">
          <input className={inputCls} value={form.categoria} onChange={set("categoria")} list="cat-list" placeholder="Ex: TECIDO" />
          <datalist id="cat-list">{categorias.map((c) => <option key={c} value={c} />)}</datalist>
        </Field>
        <Field label="Subcategoria / Grupo"><input className={inputCls} value={form.subcategoria} onChange={set("subcategoria")} /></Field>
      </div>
      <div className="grid grid-cols-2 gap-x-4">
        <Field label="Unidade">
          <select className={inputCls} value={form.unidade} onChange={set("unidade")}>
            {UNIDADES.map((u) => <option key={u} value={u}>{u}</option>)}
          </select>
        </Field>
        <Field label="Localizacao"><input className={inputCls} value={form.localizacao} onChange={set("localizacao")} placeholder="Ex: Deposito A" /></Field>
      </div>
      <div className="grid grid-cols-3 gap-x-3">
        <Field label="Estoque atual"><input type="number" step="any" className={inputCls + " bq-mono"} value={form.estoqueAtual} onChange={setNum("estoqueAtual")} /></Field>
        <Field label="Estoque minimo"><input type="number" step="any" className={inputCls + " bq-mono"} value={form.estoqueMinimo} onChange={setNum("estoqueMinimo")} /></Field>
        <Field label="Estoque maximo"><input type="number" step="any" className={inputCls + " bq-mono"} value={form.estoqueMaximo} onChange={setNum("estoqueMaximo")} /></Field>
      </div>
      <div className="grid grid-cols-2 gap-x-4">
        <Field label="Custo unitario (R$)"><input type="number" step="any" className={inputCls + " bq-mono"} value={form.custoUnitario} onChange={setNum("custoUnitario")} /></Field>
        <Field label="Fornecedor principal">
          <select className={inputCls} value={form.fornecedorId} onChange={set("fornecedorId")}>
            <option value="">Selecione...</option>
            {fornecedores.map((f) => <option key={f.id} value={f.id}>{f.nomeFantasia || f.razaoSocial}</option>)}
          </select>
        </Field>
      </div>
      <Field label="Observacao"><textarea className={inputCls} rows={2} value={form.observacao} onChange={set("observacao")} /></Field>
      <div className="flex justify-end gap-2 mt-4 pt-4 border-t border-[#E4E9F5] sticky bottom-0 bg-white -mx-6 px-6 pb-1">
        <button type="button" onClick={onCancel} className="px-4 py-2 rounded-lg text-sm font-medium text-[#475569] hover:bg-[#EEF2FA]">Cancelar</button>
        <button type="submit" className="px-4 py-2 rounded-lg text-sm font-semibold text-white flex items-center gap-1.5 bq-btn-primary">
          <Save size={14} /> Salvar item
        </button>
      </div>
    </form>
  );
}

function EstoqueView({ products, categorias, categoriasComContagem, fornecedores, fornecedorNome, onAdd, onUpdate, onDelete, showToast, onMesclarCategorias }) {
  const [q, setQ] = useState("");
  const [filtroStatus, setFiltroStatus] = useState("todos");
  const [filtroCategoria, setFiltroCategoria] = useState("todas");
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState(1);
  const [modal, setModal] = useState(null); // {mode:'add'|'edit', product}
  const [confirmDel, setConfirmDel] = useState(null);
  const [confirmacao, setConfirmacao] = useState(null);
  const [modalCategorias, setModalCategorias] = useState(false);

  const filtered = useMemo(() => {
    let list = products.filter((p) => {
      if (filtroStatus !== "todos" && getStatus(p) !== filtroStatus) return false;
      if (filtroCategoria !== "todas" && p.categoria !== filtroCategoria) return false;
      if (q.trim()) {
        const term = q.toLowerCase();
        const hay = [p.codigo, p.descricao, p.categoria, p.localizacao, fornecedorNome(p.fornecedorId)].join(" ").toLowerCase();
        if (!hay.includes(term)) return false;
      }
      return true;
    });
    if (sortKey) {
      list = [...list].sort((a, b) => {
        let av = a[sortKey], bv = b[sortKey];
        if (typeof av === "string") return av.localeCompare(bv) * sortDir;
        return ((av || 0) - (bv || 0)) * sortDir;
      });
    }
    return list;
  }, [products, q, filtroStatus, filtroCategoria, sortKey, sortDir, fornecedorNome]);

  function toggleSort(key) {
    if (sortKey === key) setSortDir((d) => -d);
    else { setSortKey(key); setSortDir(1); }
  }

  function exportCurrent() {
    const rows = filtered.map((p) => ({
      Codigo: p.codigo, Descricao: p.descricao, Categoria: p.categoria, Subcategoria: p.subcategoria,
      Unidade: p.unidade, Localizacao: p.localizacao, "Estoque Atual": p.estoqueAtual,
      "Estoque Minimo": p.estoqueMinimo, "Estoque Maximo": p.estoqueMaximo,
      "Custo Unitario": p.custoUnitario, Fornecedor: fornecedorNome(p.fornecedorId),
      Status: STATUS_META[getStatus(p)].label, Observacao: p.observacao,
    }));
    exportWorkbook([{ name: "Estoque", rows }], "estoque_brasquality_" + todayISO() + ".xlsx");
  }

  const SortHeader = ({ label, k, className }) => (
    <th onClick={() => toggleSort(k)} className={"px-3 py-2.5 text-left font-semibold text-[#475569] cursor-pointer select-none " + (className || "")}>
      <span className="inline-flex items-center gap-1">{label}{sortKey === k && <ChevronDown size={12} className={sortDir === -1 ? "rotate-180" : ""} />}</span>
    </th>
  );

  return (
    <div className="bq-fade-in">
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <div>
          <h1 className="bq-display text-2xl font-bold text-[#16233F]">Estoque</h1>
          <p className="text-sm text-[#64748B] mt-0.5">{filtered.length} de {products.length} itens</p>
        </div>
        <div className="flex gap-2">
          <button onClick={exportCurrent} className="flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-[#16233F] border border-[#D6DEF0] hover:bg-white bq-btn-ghost">
            <Download size={15} /> Exportar
          </button>
          <button onClick={() => { setModal({ mode: "add" }); setConfirmacao(null); }} className="flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-white text-sm font-semibold bq-btn-primary">
            <Plus size={15} /> Adicionar item
          </button>
        </div>
      </div>

      {confirmacao && (
        <div className="mb-4 px-4 py-3 rounded-xl flex items-center justify-between gap-3 flex-wrap bq-fade-in" style={{ background: "#E4F5EC", border: "1px solid #BFE6D3" }}>
          <div className="flex items-center gap-2.5">
            <CheckCircle2 size={16} className="text-[#1E8E5A] shrink-0" />
            <p className="text-sm text-[#1E8E5A]">
              <strong>{confirmacao.isNew ? "Item cadastrado." : "Item atualizado."}</strong> {confirmacao.descricao} foi salvo com sucesso.
              {!confirmacao.visible && " Ele nao aparece na lista abaixo porque os filtros atuais escondem esse item."}
            </p>
          </div>
          {!confirmacao.visible && (
            <button
              onClick={() => { setQ(""); setFiltroStatus("todos"); setFiltroCategoria("todas"); setConfirmacao(null); }}
              className="text-xs font-semibold text-[#1E8E5A] underline shrink-0"
            >
              Limpar filtros para ver o item
            </button>
          )}
        </div>
      )}

      <div className="flex flex-wrap gap-2.5 mb-4">
        <div className="relative flex-1 min-w-[220px]">
          <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-[#64748B]" />
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Pesquisar por codigo, descricao, categoria..." className={inputCls + " pl-9"} />
        </div>
        <select value={filtroStatus} onChange={(e) => setFiltroStatus(e.target.value)} className={inputCls + " w-auto"}>
          <option value="todos">Todos os status</option>
          <option value="normal">Normal</option>
          <option value="baixo">Baixo</option>
          <option value="critico">Critico</option>
          <option value="zerado">Zerado</option>
        </select>
        <select value={filtroCategoria} onChange={(e) => setFiltroCategoria(e.target.value)} className={inputCls + " w-auto"}>
          <option value="todas">Todas as categorias</option>
          {categorias.map((c) => <option key={c} value={c}>{c}</option>)}
        </select>
        <button onClick={() => setModalCategorias(true)} className="flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-[#16233F] border border-[#D6DEF0] hover:bg-white bq-btn-ghost">
          <Layers size={15} /> Gerenciar categorias
        </button>
      </div>

      <div className="bg-white rounded-2xl border border-[#E4E9F5] overflow-hidden">
        <div className="overflow-x-auto bq-scroll">
          <table className="w-full text-sm min-w-[900px] bq-table">
            <thead>
              <tr className="border-b border-[#E4E9F5] bg-[#F4F6FB]">
                <SortHeader label="Codigo" k="codigo" />
                <SortHeader label="Item" k="descricao" />
                <SortHeader label="Categoria" k="categoria" />
                <th className="px-3 py-2.5 text-left font-semibold text-[#475569]">Nivel</th>
                <SortHeader label="Atual" k="estoqueAtual" className="text-right" />
                <th className="px-3 py-2.5 text-right font-semibold text-[#475569]">Min / Max</th>
                <th className="px-3 py-2.5 text-left font-semibold text-[#475569]">Status</th>
                <th className="px-3 py-2.5 text-right font-semibold text-[#475569]">Acoes</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((p) => {
                const st = getStatus(p);
                return (
                  <tr key={p.id} className="border-b border-[#EEF2FA] hover:bg-[#F4F6FB]">
                    <td className="px-3 py-2.5 bq-mono text-xs text-[#475569] whitespace-nowrap">{p.codigo || "-"}</td>
                    <td className="px-3 py-2.5 text-[#16233F] font-medium min-w-[280px] max-w-[420px]">
                      <div className="leading-snug" title={p.descricao}>{p.descricao}</div>
                      <div className="text-xs text-[#64748B]">{p.unidade}{p.localizacao ? " \u00b7 " + p.localizacao : ""}</div>
                    </td>
                    <td className="px-3 py-2.5 text-[#475569] whitespace-nowrap">{p.categoria || "-"}</td>
                    <td className="px-3 py-2.5 w-32"><LayeredStockBar product={p} /></td>
                    <td className="px-3 py-2.5 text-right bq-mono font-semibold text-[#16233F] whitespace-nowrap">{fmtNum(p.estoqueAtual)}</td>
                    <td className="px-3 py-2.5 text-right bq-mono text-xs text-[#64748B] whitespace-nowrap">{fmtNum(p.estoqueMinimo)} / {fmtNum(p.estoqueMaximo)}</td>
                    <td className="px-3 py-2.5"><StatusBadge status={st} /></td>
                    <td className="px-3 py-2.5">
                      <div className="flex items-center justify-end gap-1">
                        <button onClick={() => { setModal({ mode: "edit", product: p }); setConfirmacao(null); }} className="w-7 h-7 rounded-lg hover:bg-[#E4E9F5] flex items-center justify-center text-[#475569] bq-icon-btn bq-icon-btn-edit"><Pencil size={13} /></button>
                        <button onClick={() => setConfirmDel(p)} className="w-7 h-7 rounded-lg hover:bg-[#FCE7E3] flex items-center justify-center text-[#C8492D] bq-icon-btn bq-icon-btn-delete"><Trash2 size={13} /></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        {filtered.length === 0 && <EmptyState icon={Package} title="Nenhum item encontrado" subtitle="Ajuste os filtros ou cadastre um novo item de estoque." />}
      </div>

      {modal && (
        <Modal title={modal.mode === "add" ? "Adicionar item" : "Editar item"} onClose={() => setModal(null)} wide>
          <ProductForm
            initial={modal.product}
            categorias={categorias}
            fornecedores={fornecedores}
            onCancel={() => setModal(null)}
            onSave={(data) => {
              try {
                if (modal.mode === "add") {
                  onAdd(data);
                  setConfirmacao({ descricao: data.descricao, isNew: true, visible: true });
                } else {
                  onUpdate(modal.product.id, data);
                  try {
                    const merged = { ...modal.product, ...data };
                    const status = getStatus(merged);
                    const passesStatus = filtroStatus === "todos" || status === filtroStatus;
                    const passesCategoria = filtroCategoria === "todas" || merged.categoria === filtroCategoria;
                    let passesSearch = true;
                    if (q.trim()) {
                      const term = q.toLowerCase();
                      const hay = [merged.codigo, merged.descricao, merged.categoria, merged.localizacao, fornecedorNome(merged.fornecedorId)].join(" ").toLowerCase();
                      passesSearch = hay.includes(term);
                    }
                    setConfirmacao({ descricao: merged.descricao, isNew: false, visible: passesStatus && passesCategoria && passesSearch });
                  } catch (innerErr) {
                    console.error("Falha ao calcular visibilidade do item editado (nao afeta o salvamento)", innerErr);
                    setConfirmacao({ descricao: data.descricao, isNew: false, visible: true });
                  }
                }
              } catch (err) {
                console.error("Falha ao salvar item", err);
                showToast("Ocorreu um erro ao salvar. Tente novamente; se persistir, avise o suporte.", "warn");
              } finally {
                setModal(null);
              }
            }}
          />
        </Modal>
      )}

      {confirmDel && (
        <Modal title="Excluir item" onClose={() => setConfirmDel(null)}>
          <p className="text-sm text-[#16233F] mb-4">Tem certeza que deseja excluir <span className="font-semibold">{confirmDel.descricao}</span>? Esta acao nao pode ser desfeita.</p>

            <button onClick={() => setConfirmDel(null)} className="px-4 py-2 rounded-lg text-sm font-medium text-[#475569] hover:bg-[#EEF2FA]">Cancelar</button>
            <button onClick={() => { onDelete(confirmDel.id); setConfirmDel(null); }} className="px-4 py-2 rounded-lg text-sm font-semibold text-white bq-btn-danger">Excluir</button>
          </div>
        </Modal>
      )}

      {modalCategorias && (
        <CategoriasManagerModal
          categoriasComContagem={categoriasComContagem}
          onMesclarCategorias={onMesclarCategorias}
          onClose={() => setModalCategorias(false)}
        />
      )}
    </div>
  );
}

function CategoriasManagerModal({ categoriasComContagem, onMesclarCategorias, onClose }) {
  const [de, setDe] = useState("");
  const [para, setPara] = useState("");

  const grupos = useMemo(() => {
    const map = {};
    categoriasComContagem.forEach((c) => {
      const norm = c.nome.trim().toLowerCase();
      if (!map[norm]) map[norm] = [];
      map[norm].push(c);
    });
    return Object.values(map)
      .filter((g) => g.length > 1)
      .map((g) => g.sort((a, b) => b.count - a.count));
  }, [categoriasComContagem]);

  function unificarGrupo(grupo) {
    const alvo = grupo[0].nome;
    grupo.slice(1).forEach((c) => onMesclarCategorias(c.nome, alvo));
  }

  return (
    <Modal title="Gerenciar categorias" onClose={onClose} wide>
      {grupos.length > 0 && (
        <div className="mb-5">
          <p className="text-sm font-semibold text-[#B23A2E] mb-2">Possiveis duplicidades encontradas</p>
          <div className="space-y-2">
            {grupos.map((g, i) => (
              <div key={i} className="flex items-center justify-between gap-3 px-3 py-2.5 rounded-lg flex-wrap" style={{ background: "#FCE7E3", border: "1px solid #F0C4BB" }}>
                <div className="text-sm text-[#7A1F1F]">
                  {g.map((c, j) => (
                    <span key={c.nome}>
                      {j > 0 && <span className="text-[#B23A2E] mx-1">+</span>}
                      <strong>"{c.nome}"</strong> ({c.count} {c.count === 1 ? "item" : "itens"})
                    </span>
                  ))}
                </div>
                <button onClick={() => unificarGrupo(g)} className="px-3 py-1.5 rounded-lg text-white text-xs font-semibold bq-btn-primary whitespace-nowrap">
                  Unificar em "{g[0].nome}"
                </button>
              </div>
            ))}
          </div>
        </div>
      )}

      <p className="text-sm font-semibold text-[#16233F] mb-2">Mesclar categorias manualmente</p>
      <p className="text-sm text-[#64748B] mb-3">Escolha uma categoria de origem e uma de destino. Todos os itens da origem passam a usar o nome da categoria de destino, e a categoria de origem deixa de existir.</p>
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3">
        <Field label="De (sera removida)">
          <select value={de} onChange={(e) => setDe(e.target.value)} className={inputCls}>
            <option value="">Selecione...</option>
            {categoriasComContagem.map((c) => <option key={c.nome} value={c.nome}>{c.nome} ({c.count})</option>)}
          </select>
        </Field>
        <Field label="Para (permanece)">
          <select value={para} onChange={(e) => setPara(e.target.value)} className={inputCls}>
            <option value="">Selecione...</option>
            {categoriasComContagem.map((c) => <option key={c.nome} value={c.nome}>{c.nome} ({c.count})</option>)}
          </select>
        </Field>
      </div>
      <div className="flex justify-end gap-2 pt-3 border-t border-[#E4E9F5]">
        <button onClick={onClose} className="px-4 py-2 rounded-lg text-sm font-medium text-[#475569] hover:bg-[#EEF2FA]">Fechar</button>
        <button
          onClick={() => { if (de && para && de !== para) { onMesclarCategorias(de, para); setDe(""); setPara(""); } }}
          disabled={!de || !para || de === para}
          className="px-4 py-2 rounded-lg text-sm font-semibold text-white bq-btn-primary disabled:opacity-40"
        >
          Mesclar categorias
        </button>
      </div>

      <div className="mt-5 pt-4 border-t border-[#E4E9F5]">
        <p className="text-sm font-semibold text-[#16233F] mb-2">Todas as categorias ({categoriasComContagem.length})</p>
        <div className="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto bq-scroll">
          {categoriasComContagem.map((c) => (
            <span key={c.nome} className="px-2.5 py-1 rounded-full text-xs bg-[#F4F6FB] text-[#475569] border border-[#E4E9F5]">
              {c.nome} <span className="text-[#64748B]">({c.count})</span>
            </span>
          ))}
        </div>
      </div>
    </Modal>
  );
}

function ProductPicker({ products, value, onChange }) {
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(false);
  const selected = products.find((p) => p.id === value);
  const results = useMemo(() => {
    if (!q.trim()) return products.slice(0, 30);
    const term = q.toLowerCase();
    return products.filter((p) => (p.codigo + " " + p.descricao).toLowerCase().includes(term)).slice(0, 30);
  }, [q, products]);

  return (
    <div className="relative">
      <input
        className={inputCls}
        placeholder="Buscar por codigo ou descricao..."
        value={open ? q : (selected ? (selected.codigo ? selected.codigo + " - " : "") + selected.descricao : q)}
        onChange={(e) => { setQ(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 150)}
      />
      {open && (
        <div className="absolute z-20 mt-1 w-full max-h-56 overflow-y-auto bq-scroll bg-white border border-[#D6DEF0] rounded-lg shadow-lg">
          {results.length === 0 && <div className="px-3 py-2 text-sm text-[#64748B]">Nenhum item encontrado</div>}
          {results.map((p) => (
            <button
              type="button"
              key={p.id}
              onMouseDown={() => { onChange(p.id); setQ(""); setOpen(false); }}
              className="w-full text-left px-3 py-2 text-sm hover:bg-[#EEF2FA] flex items-center justify-between gap-2"
            >
              <span className="truncate">
                <span className="bq-mono text-xs text-[#64748B]">{p.codigo}</span> {p.descricao}
              </span>
              <span className="text-xs text-[#64748B] shrink-0">{fmtNum(p.estoqueAtual)} {p.unidade}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function EntradaView({ products, fornecedores, onSubmit }) {
  const [produtoId, setProdutoId] = useState("");
  const [quantidade, setQuantidade] = useState("");
  const [valorUnitario, setValorUnitario] = useState("");
  const [fornecedor, setFornecedor] = useState("");
  const [notaFiscal, setNotaFiscal] = useState("");
  const [pedido, setPedido] = useState("");
  const [responsavel, setResponsavel] = useState("");
  const [observacao, setObservacao] = useState("");
  const [data, setData] = useState(todayISO());
  const [confirmacao, setConfirmacao] = useState(null);

  const prod = products.find((p) => p.id === produtoId);

  function submit(e) {
    e.preventDefault();
    if (!produtoId || !quantidade) return;
    onSubmit({ produtoId, quantidade, valorUnitario, fornecedor, notaFiscal, pedido, responsavel, observacao, data });
    setConfirmacao({
      descricao: prod ? prod.descricao : "",
      novoEstoque: (Number(prod ? prod.estoqueAtual : 0) || 0) + (Number(quantidade) || 0),
      unidade: prod ? prod.unidade : "",

function HistoricoView({ movimentacoes, products, categorias }) {

  const prodMap = useMemo(() => Object.fromEntries(products.map((p) => [p.id, p])), [products]);

  const filtered = useMemo(() => {
    return movimentacoes.filter((m) => {
      if (tipo !== "todos" && m.tipo !== tipo) return false;
      const prod = prodMap[m.produtoId];
      if (categoria !== "todas" && prod?.categoria !== categoria) return false;
      if (q.trim()) {
        const term = q.toLowerCase();
        const hay = [prod?.codigo, prod?.descricao, m.responsavel, m.fornecedor].join(" ").toLowerCase();
        if (!hay.includes(term)) return false;
      }
      return true;

/* ============================= COMPRAS ============================= */
function ComprasView({ products, fornecedores, fornecedorNome, onUpdateProduct, showToast }) {
  const [selecionados, setSelecionados] = useState({});
  const [fornecedorEscolhido, setFornecedorEscolhido] = useState("todos");

  const allSugestoes = useMemo(() => {
    return products
      .map((p) => ({ p, priority: getPriority(p) }))
      .filter((x) => x.priority)
      .map((x) => ({
        ...x,
        sugerido: Math.max(0, (Number(x.p.estoqueMaximo) || 0) - (Number(x.p.estoqueAtual) || 0)),
      }))
      .sort((a, b) => {
        const order = { urgente: 0, critico: 1, atencao: 2 };
        return order[a.priority] - order[b.priority];
      });
  }, [products]);

  const fornecedoresComPendencia = useMemo(() => {
    const counts = {};
    let semFornecedor = 0;
    allSugestoes.forEach((s) => {
      if (s.p.fornecedorId) counts[s.p.fornecedorId] = (counts[s.p.fornecedorId] || 0) + 1;
      else semFornecedor++;
    });
    const list = fornecedores
      .filter((f) => counts[f.id])
      .map((f) => ({ id: f.id, nome: f.nomeFantasia || f.razaoSocial, count: counts[f.id] }))
      .sort((a, b) => b.count - a.count);
    return { list, semFornecedor };
  }, [allSugestoes, fornecedores]);

  const sugestoes = useMemo(() => {
    if (fornecedorEscolhido === "todos") return allSugestoes;
    if (fornecedorEscolhido === "sem-fornecedor") return allSugestoes.filter((s) => !s.p.fornecedorId);
    return allSugestoes.filter((s) => s.p.fornecedorId === fornecedorEscolhido);
  }, [allSugestoes, fornecedorEscolhido]);

  const totals = useMemo(() => {
    let valor = 0, count = 0;
    sugestoes.forEach((s) => {
      valor += s.sugerido * (Number(s.p.custoUnitario) || 0);
      count++;
    });
    return { valor, count };
  }, [sugestoes]);

  const selecionadosList = sugestoes.filter((s) => selecionados[s.p.id]);
  const valorSelecionado = selecionadosList.reduce((sum, s) => sum + s.sugerido * (Number(s.p.custoUnitario) || 0), 0);
  const [fornecedorParaAtribuir, setFornecedorParaAtribuir] = useState("");

  function toggleAll() {
    if (selecionadosList.length === sugestoes.length) setSelecionados({});
    else setSelecionados(Object.fromEntries(sugestoes.map((s) => [s.p.id, true])));
  }

  function atribuirFornecedorEmLote() {
    if (!fornecedorParaAtribuir || selecionadosList.length === 0) return;
    selecionadosList.forEach((s) => onUpdateProduct(s.p.id, { fornecedorId: fornecedorParaAtribuir }));
    showToast(selecionadosList.length + " itens atualizados com o fornecedor " + fornecedorNome(fornecedorParaAtribuir) + ".");
    setSelecionados({});
    setFornecedorParaAtribuir("");
  }

  function nomeFornecedorEscolhido() {
    if (fornecedorEscolhido === "todos") return "Todos os fornecedores";
    if (fornecedorEscolhido === "sem-fornecedor") return "Sem fornecedor definido";
    return fornecedorNome(fornecedorEscolhido) || "Fornecedor";
  }

  function gerarRelatorio() {
    const rows = sugestoes.map((s) => ({
      Codigo: s.p.codigo, Item: s.p.descricao, Unidade: s.p.unidade, "Estoque Atual": s.p.estoqueAtual,
      "Estoque Minimo": s.p.estoqueMinimo, "Quantidade Sugerida": s.sugerido,
      "Custo Unitario": s.p.custoUnitario, "Valor Estimado": s.sugerido * (Number(s.p.custoUnitario) || 0),
      Fornecedor: fornecedorNome(s.p.fornecedorId), Prioridade: PRIORITY_META[s.priority].label,
    }));
    rows.push({ Codigo: "", Item: "TOTAL ESTIMADO", "Valor Estimado": totals.valor });
    const sufixo = fornecedorEscolhido === "todos" ? "" : "_" + nomeFornecedorEscolhido().toLowerCase().replace(/[^a-z0-9]+/g, "-");
    exportWorkbook([{ name: "Sugestao de Compras", rows }], "relatorio_compras" + sufixo + "_" + todayISO() + ".xlsx");
  }

  function gerarPedido() {
    if (selecionadosList.length === 0) return;
    const byFornecedor = {};
    selecionadosList.forEach((s) => {
      const key = fornecedorNome(s.p.fornecedorId) || "Sem fornecedor";
      if (!byFornecedor[key]) byFornecedor[key] = [];
      byFornecedor[key].push({
        Fornecedor: key, Codigo: s.p.codigo, Produto: s.p.descricao, Quantidade: s.sugerido, Unidade: s.p.unidade,
        "Valor Unitario": s.p.custoUnitario, "Valor Total": s.sugerido * (Number(s.p.custoUnitario) || 0),
      });
    });
    const sheets = Object.entries(byFornecedor).map(([name, rows]) => ({ name: name.slice(0, 28) || "Pedido", rows }));
    exportWorkbook(sheets, "pedido_compra_" + todayISO() + ".xlsx");
  }

  return (

              className={inputCls}
            >
              <option value="todos">Todos os fornecedores ({allSugestoes.length} itens)</option>
              {fornecedoresComPendencia.list.map((f) => (
                <option key={f.id} value={f.id}>{f.nome} ({f.count} {f.count === 1 ? "item" : "itens"})</option>
              ))}
              {fornecedoresComPendencia.semFornecedor > 0 && (
                <option value="sem-fornecedor">Sem fornecedor definido ({fornecedoresComPendencia.semFornecedor} itens)</option>
              )}

          </div>
          <div>
            <span className="block text-sm font-semibold text-[#16233F] mb-1.5">2. Gere o relatorio</span>

              <FileSpreadsheet size={15} /> Gerar relatorio - {nomeFornecedorEscolhido()}
            </button>
          </div>

      )}

      {sugestoes.length === 0 ? (
        <div className="bg-white rounded-2xl border border-[#E4E9F5]">
          <EmptyState
            icon={CheckCircle2}
            title={allSugestoes.length === 0 ? "Nenhuma reposicao necessaria" : "Nenhum item deste fornecedor precisa de reposicao"}
            subtitle={allSugestoes.length === 0 ? "Todos os itens estao com estoque acima do minimo definido." : "Escolha outro fornecedor acima ou selecione \"Todos os fornecedores\"."}

            {selecionadosList.length > 0 ? (

/* ============================= FORNECEDORES ============================= */
const emptyFornecedor = { codigo: "", razaoSocial: "", nomeFantasia: "", cnpj: "", telefone: "", email: "", contato: "", prazoEntrega: "", observacoes: "" };

function FornecedoresView({ fornecedores, products, setFornecedores, showToast }) {
  const [modal, setModal] = useState(null);
  const [expanded, setExpanded] = useState(null);

  function save(form) {
    if (modal.mode === "add") {
      setFornecedores((prev) => [{ id: uid("f"), ...form }, ...prev]);
      showToast("Fornecedor cadastrado.");
    } else {
      setFornecedores((prev) => prev.map((f) => (f.id === modal.fornecedor.id ? { ...f, ...form } : f)));
      showToast("Fornecedor atualizado.");
    }
    setModal(null);
  }

  function remove(id) {
    setFornecedores((prev) => prev.filter((f) => f.id !== id));
    showToast("Fornecedor removido.", "warn");
  }

  return (
    <div className="bq-fade-in">
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <div>
          <h1 className="bq-display text-2xl font-bold text-[#16233F]">Fornecedores</h1>

          <Plus size={15} /> Novo fornecedor
        </button>
      </div>

      {fornecedores.length === 0 ? (
        <div className="bg-white rounded-2xl border border-[#E4E9F5]">
          <EmptyState icon={Truck} title="Nenhum fornecedor cadastrado" subtitle="Cadastre fornecedores para vincular aos itens de estoque." />
        </div>
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
          {fornecedores.map((f) => {
            const itens = products.filter((p) => p.fornecedorId === f.id);
            const criticos = itens.filter((p) => getStatus(p) === "critico" || getStatus(p) === "zerado");
            const isOpen = expanded === f.id;
            return (
              <div key={f.id} className="bg-white rounded-2xl border border-[#E4E9F5] p-5 bq-card-hover">

                    <p className="text-xs text-[#64748B] mt-0.5">{f.contato || f.telefone || f.email || "Sem dados de contato"}</p>
                  </div>
                  <div className="flex gap-1">
                    <button onClick={() => setModal({ mode: "edit", fornecedor: f })} className="w-7 h-7 rounded-lg hover:bg-[#E4E9F5] flex items-center justify-center text-[#475569] bq-icon-btn bq-icon-btn-edit"><Pencil size={13} /></button>
                    <button onClick={() => remove(f.id)} className="w-7 h-7 rounded-lg hover:bg-[#FCE7E3] flex items-center justify-center text-[#C8492D] bq-icon-btn bq-icon-btn-delete"><Trash2 size={13} /></button>
                  </div>
                </div>
                <div className="flex items-center gap-3 mt-3 text-xs">
                  <span className="text-[#475569]">{itens.length} itens fornecidos</span>
                  {criticos.length > 0 && <span className="text-[#C8492D] font-semibold">{criticos.length} em reposicao</span>}
                </div>
                {itens.length > 0 && (
                  <button onClick={() => setExpanded(isOpen ? null : f.id)} className="text-xs text-[#2452B0] font-medium mt-2 flex items-center gap-1">
                    {isOpen ? "Ocultar itens" : "Ver itens"} <ChevronDown size={12} className={isOpen ? "rotate-180" : ""} />
                  </button>
                )}
                {isOpen && (
                  <div className="mt-2 pt-2 border-t border-[#E4E9F5] space-y-1.5 max-h-40 overflow-y-auto bq-scroll">

                      <div key={p.id} className="flex items-center justify-between text-xs">

        </Modal>
      )}
