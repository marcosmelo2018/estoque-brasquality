function FornecedorForm({ initial, onSave, onCancel }) {
  const [form, setForm] = useState(initial || emptyFornecedor);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  function submit(e) {
    e.preventDefault();
    if (!form.razaoSocial.trim() && !form.nomeFantasia.trim()) return;
    onSave(form);
  }
  return (
    <form onSubmit={submit}>
      <Field label="Nome / Razao social" required><input className={inputCls} value={form.razaoSocial} onChange={set("razaoSocial")} /></Field>
      <Field label="Nome fantasia"><input className={inputCls} value={form.nomeFantasia} onChange={set("nomeFantasia")} /></Field>
      <div className="grid grid-cols-2 gap-x-4">
        <Field label="CNPJ"><input className={inputCls} value={form.cnpj} onChange={set("cnpj")} /></Field>
        <Field label="Telefone"><input className={inputCls} value={form.telefone} onChange={set("telefone")} /></Field>
      </div>
      <div className="grid grid-cols-2 gap-x-4">
        <Field label="E-mail"><input className={inputCls} value={form.email} onChange={set("email")} /></Field>
        <Field label="Contato"><input className={inputCls} value={form.contato} onChange={set("contato")} /></Field>
      </div>
      <Field label="Prazo medio de entrega"><input className={inputCls} value={form.prazoEntrega} onChange={set("prazoEntrega")} placeholder="Ex: 15 dias" /></Field>
      <Field label="Observacoes"><textarea className={inputCls} rows={2} value={form.observacoes} onChange={set("observacoes")} /></Field>
      <div className="flex justify-end gap-2 mt-4 pt-4 border-t border-[#E4E9F5]">
        <button type="button" onClick={onCancel} className="px-4 py-2 rounded-lg text-sm font-medium text-[#475569] hover:bg-[#EEF2FA]">Cancelar</button>
        <button type="submit" className="px-4 py-2 rounded-lg text-sm font-semibold text-white bq-btn-primary">Salvar</button>
      </div>
    </form>
  );
}

/* ============================= IMPORT / EXPORT ============================= */
function ImportExportView({ products, fornecedores, movimentacoes, setProducts, showToast, resetDemo, clearAll, odStatus, odError, odAccountName, odLastSync, connectOneDrive, disconnectOneDrive }) {
  const [preview, setPreview] = useState(null);
  const [confirmReset, setConfirmReset] = useState(false);
  const [confirmClear, setConfirmClear] = useState(false);
  const fileRef = useRef(null);

  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const wb = XLSX.read(ev.target.result, { type: "array" });
        const allRows = [];
        wb.SheetNames.forEach((sheetName) => {
          const ws = wb.Sheets[sheetName];
          const json = XLSX.utils.sheet_to_json(ws, { defval: "" });
          json.forEach((row) => {
            const mapped = mapImportedRow(row);
            if (!mapped.descricao && !mapped.codigo) return;
            allRows.push({
              codigo: String(mapped.codigo || ""),
              descricao: String(mapped.descricao || mapped.codigo || "Item sem nome"),
              categoria: String(mapped.categoria || sheetName),
              unidade: String(mapped.unidade || "UN").toUpperCase(),
              fornecedor: String(mapped.fornecedor || ""),
              estoqueAtual: Number(mapped.estoqueAtual) || 0,
              estoqueMinimo: Number(mapped.estoqueMinimo) || 0,
              estoqueMaximo: Number(mapped.estoqueMaximo) || 0,
              custoUnitario: Number(mapped.custoUnitario) || 0,
              localizacao: String(mapped.localizacao || ""),
              observacao: String(mapped.observacao || ""),
            });
          });
        });
        setPreview(allRows);
      } catch (err) {
        showToast("Nao foi possivel ler o arquivo. Verifique se e um .xlsx/.xlsm valido.", "warn");
      }
    };
    reader.readAsArrayBuffer(file);
    e.target.value = "";
  }

  function confirmImport() {
    const norm = (v) => String(v || "").trim().toLowerCase();
    const findFornecedorId = (nome) => {
      const n = norm(nome);
      if (!n) return "";
      const f = fornecedores.find((x) => norm(x.nomeFantasia) === n || norm(x.razaoSocial) === n);
      return f ? f.id : "";
    };

    let updated = 0, added = 0, unchanged = 0;

    setProducts((prev) => {
      const next = [...prev];
      // index existing products by codigo (preferred) and by descricao+categoria (fallback)
      const byCodigo = new Map();
      const byDescCat = new Map();
      next.forEach((p, idx) => {
        if (p.codigo && norm(p.codigo)) byCodigo.set(norm(p.codigo), idx);
        byDescCat.set(norm(p.descricao) + "|" + norm(p.categoria), idx);
      });

      preview.forEach((r) => {
        const keyCodigo = norm(r.codigo);
        const keyDescCat = norm(r.descricao) + "|" + norm(r.categoria);
        let idx = keyCodigo && byCodigo.has(keyCodigo) ? byCodigo.get(keyCodigo) : (byDescCat.has(keyDescCat) ? byDescCat.get(keyDescCat) : -1);

        if (idx >= 0) {
          const existing = next[idx];
          const fornecedorId = findFornecedorId(r.fornecedor) || existing.fornecedorId;
          const merged = {
            ...existing,
            codigo: r.codigo || existing.codigo,
            descricao: r.descricao || existing.descricao,
            categoria: r.categoria || existing.categoria,
            unidade: r.unidade || existing.unidade,
            localizacao: r.localizacao || existing.localizacao,
            estoqueAtual: r.estoqueAtual !== undefined && r.estoqueAtual !== "" ? r.estoqueAtual : existing.estoqueAtual,
            estoqueMinimo: r.estoqueMinimo || existing.estoqueMinimo,
            estoqueMaximo: r.estoqueMaximo || existing.estoqueMaximo,
            custoUnitario: r.custoUnitario || existing.custoUnitario,
            observacao: r.observacao || existing.observacao,
            fornecedorId,
          };
          const changed = JSON.stringify(merged) !== JSON.stringify(existing);
          if (changed) {
            next[idx] = merged;
            updated++;
          } else {
            unchanged++;
          }
        } else {
          const novo = {
            id: uid("p"),
            codigo: r.codigo,
            codigoInterno: "",
            descricao: r.descricao,
            categoria: r.categoria,
            subcategoria: "",
            unidade: r.unidade,
            localizacao: r.localizacao,
            estoqueAtual: r.estoqueAtual,
            estoqueMinimo: r.estoqueMinimo || Math.ceil(r.estoqueAtual * 0.2) || 10,
            estoqueMaximo: r.estoqueMaximo || Math.ceil(r.estoqueAtual * 1.5) || 100,
            qtdIdealCompra: r.estoqueMaximo || Math.ceil(r.estoqueAtual * 1.5) || 100,
            custoUnitario: r.custoUnitario,
            fornecedorId: findFornecedorId(r.fornecedor),
            observacao: r.observacao,
            dataCadastro: todayISO(),
          };
          next.push(novo);
          if (novo.codigo) byCodigo.set(norm(novo.codigo), next.length - 1);
          byDescCat.set(norm(novo.descricao) + "|" + norm(novo.categoria), next.length - 1);
          added++;
        }
      });

      return next;
    });

    const parts = [];
    if (added) parts.push(added + " novos");
    if (updated) parts.push(updated + " atualizados");
    if (unchanged) parts.push(unchanged + " sem alteracao");
    showToast(parts.length ? parts.join(", ") + "." : "Nenhuma alteracao detectada.");
    setPreview(null);
  }

  function exportTudo() {
    const rows = products.map((p) => ({
      Codigo: p.codigo, Descricao: p.descricao, Categoria: p.categoria, Subcategoria: p.subcategoria,
      Unidade: p.unidade, Localizacao: p.localizacao, "Estoque Atual": p.estoqueAtual,
      "Estoque Minimo": p.estoqueMinimo, "Estoque Maximo": p.estoqueMaximo,
      "Custo Unitario": p.custoUnitario, Observacao: p.observacao,
    }));
    const fornRows = fornecedores.map((f) => ({
      Codigo: f.codigo, "Razao Social": f.razaoSocial, "Nome Fantasia": f.nomeFantasia,
      CNPJ: f.cnpj, Telefone: f.telefone, Email: f.email, Contato: f.contato, "Prazo Entrega": f.prazoEntrega,
    }));
    const movRows = movimentacoes.map((m) => ({
      Data: fmtDate(m.data), Tipo: m.tipo, ProdutoId: m.produtoId, Quantidade: m.quantidade,
      "Estoque Antes": m.estoqueAntes, "Estoque Depois": m.estoqueDepois, Responsavel: m.responsavel || "",
    }));
    exportWorkbook([
      { name: "Estoque", rows },
      { name: "Fornecedores", rows: fornRows },
      { name: "Movimentacoes", rows: movRows },
    ], "backup_completo_brasquality_" + todayISO() + ".xlsx");
  }

  return (
    <div className="bq-fade-in max-w-3xl">
      <h1 className="bq-display text-2xl font-bold text-[#16233F] mb-1">Importar / Exportar Excel</h1>
      <p className="text-sm text-[#64748B] mb-6">O app roda no navegador e nao consegue ficar conectado direto ao arquivo no seu computador. Use importar/exportar para manter sua planilha e o app sincronizados.</p>

      <div className="bg-white rounded-2xl border border-[#E4E9F5] p-6 mb-4">
        <p className="bq-display font-semibold text-[#16233F] mb-1">Sincronizacao com OneDrive</p>
        <p className="text-sm text-[#64748B] mb-4">
          Conecte sua conta Microsoft para manter o app sincronizado automaticamente com a planilha{" "}
          <span className="font-semibold">CONTROLE_ESTOQUE_GERAL_Brasquality.xlsx</span> no seu OneDrive. Qualquer alteracao feita
          aqui e salva na planilha, e qualquer aparelho conectado carrega os dados mais recentes dela.
        </p>

        {odStatus === "idle" && (
          <button onClick={connectOneDrive} className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white text-sm font-semibold bq-btn-primary">
            <RefreshCw size={15} /> Conectar com OneDrive
          </button>
        )}

        {odStatus === "connecting" && (
          <div className="flex items-center gap-2 text-sm text-[#64748B]">
            <RefreshCw size={15} className="animate-spin" /> Conectando e carregando a planilha...
          </div>
        )}

        {odStatus === "connected" && (
          <div>
            <div className="flex items-center gap-2 text-sm text-[#1E8E5A] font-medium mb-1">
              <CheckCircle2 size={15} /> Conectado{odAccountName ? " como " + odAccountName : ""}
            </div>
            <p className="text-xs text-[#64748B] mb-3">
              {odLastSync ? "Ultima sincronizacao: " + odLastSync.toLocaleString("pt-BR") : "Sincronizando..."}
            </p>
            <button onClick={disconnectOneDrive} className="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-sm font-medium text-[#16233F] border border-[#D6DEF0] hover:bg-white bq-btn-ghost">
              Desconectar
            </button>
          </div>
        )}

        {odStatus === "error" && (
          <div>
            <div className="flex items-center gap-2 text-sm text-[#C8492D] font-medium mb-1">
              <AlertTriangle size={15} /> Nao foi possivel sincronizar
            </div>
            {odAccountName && (
              <p className="text-xs text-[#64748B] mb-1">Conectado como: <span className="font-semibold">{odAccountName}</span></p>
            )}
            <p className="text-xs text-[#7A1F1F] mb-3">{odError}</p>
            <button onClick={connectOneDrive} className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white text-sm font-semibold bq-btn-primary">
              <RefreshCw size={15} /> Tentar novamente
            </button>
          </div>
        )}
      </div>

      <div className="bg-white rounded-2xl border border-[#E4E9F5] p-6 mb-4">
        <p className="bq-display font-semibold text-[#16233F] mb-1">Importar planilha</p>
        <p className="text-sm text-[#64748B] mb-4">Envie um arquivo .xlsx ou .xlsm. Cada aba e tratada como uma categoria; o sistema reconhece colunas como Codigo, Descricao, Unidade, Estoque, Fornecedor, Custo automaticamente.</p>
        <input ref={fileRef} type="file" accept=".xlsx,.xls,.xlsm" className="hidden" onChange={handleFile} />
        <button onClick={() => fileRef.current.click()} className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white text-sm font-semibold bq-btn-primary">
          <Upload size={15} /> Selecionar arquivo Excel
        </button>
      </div>

      <div className="bg-white rounded-2xl border border-[#E4E9F5] p-6 mb-4">
        <p className="bq-display font-semibold text-[#16233F] mb-1">Exportar dados</p>
        <p className="text-sm text-[#64748B] mb-4">Gera um arquivo Excel com estoque atual, fornecedores e movimentacoes, pronto para abrir no Excel ou enviar para o setor de compras.</p>
        <button onClick={exportTudo} className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold text-[#16233F] border border-[#D6DEF0] hover:bg-white bq-btn-ghost">
          <Download size={15} /> Exportar tudo (.xlsx)
        </button>
      </div>

      <div className="bg-white rounded-2xl border border-[#E4E9F5] p-6">
        <p className="bq-display font-semibold text-[#16233F] mb-1">Dados de demonstracao</p>
        <p className="text-sm text-[#64748B] mb-4">O app comecou com {SEED_PRODUCTS.length} itens importados da sua planilha original (CONTROLE_ESTOQUE_GERAL_Brasquality). Voce pode restaurar esse conjunto ou apagar tudo para comecar do zero.</p>
        <div className="flex gap-2 flex-wrap">
          <button onClick={() => setConfirmReset(true)} className="flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-[#16233F] border border-[#D6DEF0] hover:bg-white bq-btn-ghost">
            <RotateCcw size={14} /> Restaurar planilha original
          </button>
          <button onClick={() => setConfirmClear(true)} className="flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl text-sm font-medium text-[#C8492D] border border-[#F0C4BB] hover:bg-[#FCE7E3]">
            <Trash2 size={14} /> Apagar todos os dados
          </button>
        </div>
      </div>

      {preview && (
        <Modal title={"Confirmar importacao (" + preview.length + " itens)"} onClose={() => setPreview(null)} wide>
          <p className="text-sm text-[#475569] mb-3">Foram encontrados <strong>{preview.length}</strong> registros validos. Itens com o mesmo codigo (ou mesma descricao/categoria) ja cadastrados serao <strong>atualizados</strong>, sem duplicar. Os demais entram como itens novos. Confira uma amostra abaixo antes de confirmar.</p>
          <div className="border border-[#E4E9F5] rounded-lg overflow-hidden mb-4 max-h-64 overflow-y-auto bq-scroll">
            <table className="w-full text-xs">
              <thead className="bg-[#F4F6FB] sticky top-0">
                <tr>
                  <th className="px-2 py-1.5 text-left font-semibold text-[#475569]">Codigo</th>
                  <th className="px-2 py-1.5 text-left font-semibold text-[#475569]">Descricao</th>
                  <th className="px-2 py-1.5 text-left font-semibold text-[#475569]">Categoria</th>
                  <th className="px-2 py-1.5 text-right font-semibold text-[#475569]">Estoque</th>
                </tr>
              </thead>
              <tbody>
                {preview.slice(0, 12).map((r, i) => (
                  <tr key={i} className="border-t border-[#EEF2FA]">
                    <td className="px-2 py-1.5 bq-mono">{r.codigo || "-"}</td>
                    <td className="px-2 py-1.5">{r.descricao}</td>
                    <td className="px-2 py-1.5">{r.categoria}</td>
                    <td className="px-2 py-1.5 text-right bq-mono">{fmtNum(r.estoqueAtual)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="flex justify-end gap-2">
            <button onClick={() => setPreview(null)} className="px-4 py-2 rounded-lg text-sm font-medium text-[#475569] hover:bg-[#EEF2FA]">Cancelar</button>
            <button onClick={confirmImport} className="px-4 py-2 rounded-lg text-sm font-semibold text-white bq-btn-success">Confirmar importacao</button>
          </div>
        </Modal>
      )}

      {confirmReset && (
        <Modal title="Restaurar planilha original" onClose={() => setConfirmReset(false)}>
          <p className="text-sm text-[#16233F] mb-4">Isso substitui todos os dados atuais pelos {SEED_PRODUCTS.length} itens originais da planilha Brasquality e apaga o historico de movimentacoes. Deseja continuar?</p>
          <div className="flex justify-end gap-2">
            <button onClick={() => setConfirmReset(false)} className="px-4 py-2 rounded-lg text-sm font-medium text-[#475569] hover:bg-[#EEF2FA]">Cancelar</button>
            <button onClick={() => { resetDemo(); setConfirmReset(false); }} className="px-4 py-2 rounded-lg text-sm font-semibold text-white bq-btn-primary">Restaurar</button>
          </div>
        </Modal>
      )}

      {confirmClear && (
        <Modal title="Apagar todos os dados" onClose={() => setConfirmClear(false)}>
          <p className="text-sm text-[#16233F] mb-4">Isso apaga permanentemente todos os produtos, fornecedores e movimentacoes deste app. Esta acao nao pode ser desfeita.</p>
          <div className="flex justify-end gap-2">
            <button onClick={() => setConfirmClear(false)} className="px-4 py-2 rounded-lg text-sm font-medium text-[#475569] hover:bg-[#EEF2FA]">Cancelar</button>
            <button onClick={() => { clearAll(); setConfirmClear(false); }} className="px-4 py-2 rounded-lg text-sm font-semibold text-white bq-btn-danger">Apagar tudo</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function BrasqualityApp() {
  return (
    <ErrorBoundary>
      <App />
    </ErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<BrasqualityApp />);

</script>

<script>
  (function () {
    try {
      var source = document.getElementById('app-source').textContent;
      var output = Babel.transform(source, { presets: [['react', { runtime: 'classic' }]] }).code;
      (0, eval)(output);
    } catch (e) {
      var el = document.getElementById('app-fatal');
      el.style.display = 'block';
      el.textContent = 'Erro ao compilar/rodar o app:\n' + (e && e.stack ? e.stack : e);
      console.error(e);
    }
  })();
</script>
</body>
</html>
